<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home IoT | Secure Login & ESP8266 Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Free Public MQTT.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; padding: 25px 15px; }
        .container { max-width: 1100px; margin: 0 auto; }

        /* Login Screen */
        #authScreen { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
        .auth-card {
            background: var(--card-bg); padding: 35px; border-radius: 20px;
            width: 100%; max-width: 400px; border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center;
        }
        .auth-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .auth-card p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color);
            color: var(--text-primary); border-radius: 10px; font-size: 0.95rem;
        }
        .btn-full { width: 100%; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; margin-top: 10px; }
        .btn-submit { background: var(--accent-glow); color: #0f172a; }
        .auth-toggle { margin-top: 15px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; }
        .auth-toggle span { color: var(--accent-glow); font-weight: 600; }

        /* Dashboard View */
        #dashboardScreen { display: none; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 20px 25px; border-radius: 16px;
            border: 1px solid var(--border-color); margin-bottom: 15px; flex-wrap: wrap; gap: 15px;
        }
        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn {
            background: var(--accent-glow); color: #0f172a; border: none; padding: 10px 16px;
            border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-danger { background: #334155; color: #ef4444; }
        
        /* Voice Button */
        .voice-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .voice-btn.listening { background: var(--accent-red); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #voiceStatus { margin-bottom: 25px; font-size: 0.85rem; color: var(--text-secondary); text-align: center; }

        .room-section { background: rgba(30, 41, 59, 0.4); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); color: var(--accent-glow); font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        
        .card { background: var(--card-bg); border-radius: 14px; padding: 18px; border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(56,189,248,0.1); color: var(--accent-glow); display: flex; align-items: center; justify-content: center; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background: #334155; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--accent-glow); }
        input:checked + .slider:before { transform: translateX(20px); }

        .fan-btns { display: flex; gap: 4px; margin-top: 10px; }
        .f-btn { flex: 1; padding: 6px 0; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .f-btn.active { background: var(--accent-glow); color: #0f172a; border-color: var(--accent-glow); }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 50; }
        .modal-box { background: var(--card-bg); width: 100%; max-width: 380px; padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); }
        .delete-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- AUTHENTICATION SCREEN -->
        <div id="authScreen">
            <div class="auth-card">
                <h2 id="authTitle">Welcome Back</h2>
                <p id="authSubtitle">Sign in to control your smart home</p>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="emailInput" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••">
                </div>
                <button class="btn-full btn-submit" id="authBtn" onclick="handleAuth()">Sign In</button>
                <div class="auth-toggle" onclick="toggleAuthMode()">
                    <span id="toggleText">Don't have an account? Sign up</span>
                </div>
            </div>
        </div>

        <!-- MAIN DASHBOARD SCREEN -->
        <div id="dashboardScreen">
            <header>
                <div>
                    <h1 id="userGreeting">Smart Home Hub</h1>
                    <p style="color:var(--text-secondary); font-size:0.8rem;">ESP8266 ID: <span style="color:var(--accent-glow)" id="linkedEspId">Not Set</span></p>
                </div>
                <div class="header-actions">
                    <button class="btn voice-btn" id="micBtn" onclick="toggleSpeechRecognition()"><i class="fa-solid fa-microphone"></i> <span id="micText">Voice</span></button>
                    <button class="btn" onclick="openModal('espModal')"><i class="fa-solid fa-microchip"></i> Link ESP</button>
                    <button class="btn" onclick="openModal('roomModal')"><i class="fa-solid fa-house"></i> Room</button>
                    <button class="btn" onclick="openModal('deviceModal')"><i class="fa-solid fa-plus"></i> Device</button>
                    <button class="btn btn-danger" onclick="firebase.auth().signOut()">Logout</button>
                </div>
            </header>

            <div id="voiceStatus">Click the mic button and speak (e.g., "Turn on living room main bulb" or "Set living room ceiling fan speed to 2")</div>
            <div id="appContainer"></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="roomModal">
        <div class="modal-box">
            <h2>Add Room</h2>
            <div class="form-group" style="margin-top:15px;">
                <label>Room Name</label>
                <input type="text" id="roomInput" placeholder="e.g. Living Room">
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#334155; color:white; flex:1;" onclick="closeModal('roomModal')">Cancel</button>
                <button class="btn btn-submit" style="flex:1;" onclick="createRoom()">Save</button>
            </div>
        </div>
    </div>

    <div class="modal" id="deviceModal">
        <div class="modal-box">
            <h2>Add Equipment</h2>
            <div class="form-group" style="margin-top:15px;">
                <label>Select Room</label>
                <select id="roomSelect"></select>
            </div>
            <div class="form-group">
                <label>Device Name</label>
                <input type="text" id="devInput" placeholder="e.g. Main Bulb">
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="typeSelect">
                    <option value="bulb">Bulb / Switch</option>
                    <option value="fan">4-Speed Fan</option>
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#334155; color:white; flex:1;" onclick="closeModal('deviceModal')">Cancel</button>
                <button class="btn btn-submit" style="flex:1;" onclick="createDevice()">Save</button>
            </div>
        </div>
    </div>

    <div class="modal" id="espModal">
        <div class="modal-box">
            <h2>Link ESP8266 Hardware</h2>
            <div class="form-group" style="margin-top:15px;">
                <label>Enter ESP Device Name / ID (matches your firmware)</label>
                <input type="text" id="espIdInput" placeholder="e.g. esp8266_home_01">
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#334155; color:white; flex:1;" onclick="closeModal('espModal')">Cancel</button>
                <button class="btn btn-submit" style="flex:1;" onclick="saveEspId()">Link Device</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAhJcE0i2-uL9txjY6W_DmDV9onBy4yldo",
            authDomain: "homeiot-automanual-final-alexa.firebaseapp.com",
            databaseURL: "https://homeiot-automanual-final-alexa-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "homeiot-automanual-final-alexa",
            storageBucket: "homeiot-automanual-final-alexa.firebasestorage.app",
            messagingSenderId: "25429678578",
            appId: "1:25429678578:web:eb97a63e37f7e10ea8f36b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isSignUp = false;
        let currentUser = null;
        let userDbRef = null;
        let activeEspId = "";
        let globalRoomsData = {};

        // Free Public MQTT Broker connection over WebSockets securely
        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8883/mqtt');

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                document.getElementById('userGreeting').innerText = `Welcome, ${user.email.split('@')[0]}`;
                
                userDbRef = db.ref(`users/${user.uid}`);
                userDbRef.on('value', snap => {
                    const data = snap.val() || {};
                    globalRoomsData = data.rooms || {};
                    renderDashboard(globalRoomsData);
                    populateDropdown(globalRoomsData);
                    if(data.esp_id) {
                        activeEspId = data.esp_id;
                        document.getElementById('linkedEspId').innerText = activeEspId;
                        mqttClient.subscribe(`smart_home/${activeEspId}/#`);
                    }
                });
            } else {
                currentUser = null;
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('dashboardScreen').style.display = 'none';
            }
        });

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').innerText = isSignUp ? "Create Account" : "Welcome Back";
            document.getElementById('authSubtitle').innerText = isSignUp ? "Register to manage your smart nodes" : "Sign in to control your smart home";
            document.getElementById('authBtn').innerText = isSignUp ? "Sign Up" : "Sign In";
            document.getElementById('toggleText').innerHTML = isSignUp ? "Already have an account? <span>Sign in</span>" : "Don't have an account? <span>Sign up</span>";
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if(!email || !password) return alert('Please enter email and password');
            if(isSignUp) {
                firebase.auth().createUserWithEmailAndPassword(email, password).catch(err => alert(err.message));
            } else {
                firebase.auth().signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
            }
        }

        mqttClient.on('message', (topic, payload) => {
            const msg = payload.toString();
            const parts = topic.split('/');
            if(parts.length === 4) {
                const rKey = parts[2];
                const dKey = parts[3];
                userDbRef.child(`rooms/${rKey}/devices/${dKey}`).once('value', snap => {
                    const dev = snap.val();
                    if(dev) {
                        if(dev.type === 'bulb') userDbRef.child(`rooms/${rKey}/devices/${dKey}`).update({state: msg === 'ON'});
                        if(dev.type === 'fan') userDbRef.child(`rooms/${rKey}/devices/${dKey}`).update({speed: parseInt(msg)});
                    }
                });
            }
        });

        function renderDashboard(rooms) {
            const container = document.getElementById('appContainer');
            container.innerHTML = '';
            const rKeys = Object.keys(rooms);
            if(rKeys.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding:30px;">No rooms created yet. Click "Room" to start.</p>'; return; }

            rKeys.forEach(rKey => {
                const room = rooms[rKey];
                const devices = room.devices || {};
                let html = `<div class="room-section"><div class="room-header"><span><i class="fa-solid fa-door-open"></i> ${room.name}</span><button class="delete-btn" onclick="userDbRef.child('rooms/${rKey}').remove()">Delete Room</button></div><div class="grid">`;
                
                Object.keys(devices).forEach(dKey => {
                    const d = devices[dKey];
                    if(d.type === 'bulb') {
                        html += `<div class="card"><div class="card-top"><div class="icon"><i class="fa-solid fa-lightbulb" style="color:${d.state?'#facc15':'var(--accent-glow)'}"></i></div><label class="switch"><input type="checkbox" ${d.state?'checked':''} onclick="toggleBulb('${rKey}', '${dKey}', this.checked)"><span class="slider"></span></label></div><div><h3 style="font-size:0.95rem;">${d.name}</h3><p style="font-size:0.75rem; color:var(--text-secondary);">Status: ${d.state?'ON':'OFF'}</p></div><div style="text-align:right; margin-top:8px;"><button class="delete-btn" onclick="userDbRef.child('rooms/${rKey}/devices/${dKey}').remove()">Remove</button></div></div>`;
                    } else if(d.type === 'fan') {
                        const spd = d.speed || 0;
                        html += `<div class="card"><div class="card-top"><div class="icon"><i class="fa-solid fa-fan ${spd>0?'fa-spin':''}"></i></div><div><h3 style="font-size:0.9rem;">${d.name}</h3><p style="font-size:0.75rem; color:var(--accent-glow);">Speed: Level ${spd}</p></div></div><div class="fan-btns"><button class="f-btn ${spd===0?'active':''}" onclick="setFanSpeed('${rKey}', '${dKey}', 0)">OFF</button><button class="f-btn ${spd===1?'active':''}" onclick="setFanSpeed('${rKey}', '${dKey}', 1)">1</button><button class="f-btn ${spd===2?'active':''}" onclick="setFanSpeed('${rKey}', '${dKey}', 2)">2</button><button class="f-btn ${spd===3?'active':''}" onclick="setFanSpeed('${rKey}', '${dKey}', 3)">3</button><button class="f-btn ${spd===4?'active':''}" onclick="setFanSpeed('${rKey}', '${dKey}', 4)">4</button></div><div style="text-align:right; margin-top:8px;"><button class="delete-btn" onclick="userDbRef.child('rooms/${rKey}/devices/${dKey}').remove()">Remove</button></div></div>`;
                    }
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function populateDropdown(rooms) {
            const sel = document.getElementById('roomSelect');
            sel.innerHTML = '';
            Object.keys(rooms).forEach(k => sel.innerHTML += `<option value="${k}">${rooms[k].name}</option>`);
        }

        function toggleBulb(rKey, dKey, isOn) {
            userDbRef.child(`rooms/${rKey}/devices/${dKey}`).update({state: isOn});
            if(activeEspId) mqttClient.publish(`smart_home/${activeEspId}/${rKey}/${dKey}`, isOn ? 'ON' : 'OFF');
        }

        function setFanSpeed(rKey, dKey, speed) {
            userDbRef.child(`rooms/${rKey}/devices/${dKey}`).update({speed: speed});
            if(activeEspId) mqttClient.publish(`smart_home/${activeEspId}/${rKey}/${dKey}`, speed.toString());
        }

        function createRoom() {
            const name = document.getElementById('roomInput').value.trim();
            if(!name) return;
            const rKey = name.toLowerCase().replace(/\s+/g,'_');
            userDbRef.child(`rooms/${rKey}`).set({name, devices: {}});
            document.getElementById('roomInput').value = '';
            closeModal('roomModal');
        }

        function createDevice() {
            const rKey = document.getElementById('roomSelect').value;
            const name = document.getElementById('devInput').value.trim();
            const type = document.getElementById('typeSelect').value;
            if(!rKey || !name) return;
            const dKey = name.toLowerCase().replace(/\s+/g,'_');
            const payload = type === 'bulb' ? {name, type, state: false} : {name, type, speed: 0};
            userDbRef.child(`rooms/${rKey}/devices/${dKey}`).set(payload);
            document.getElementById('devInput').value = '';
            closeModal('deviceModal');
        }

        function saveEspId() {
            const espId = document.getElementById('espIdInput').value.trim();
            if(!espId) return;
            userDbRef.update({esp_id: espId});
            closeModal('espModal');
        }

        // Browser AI Voice Recognition Engine
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if(SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('micText').innerText = "Listening...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                document.getElementById('voiceStatus').innerText = `Heard: "${transcript}"`;
                
                for(let rKey in globalRoomsData) {
                    const roomName = globalRoomsData[rKey].name.toLowerCase();
                    if(transcript.includes(roomName)) {
                        const devs = globalRoomsData[rKey].devices || {};
                        for(let dKey in devs) {
                            const devName = devs[dKey].name.toLowerCase();
                            if(transcript.includes(devName)) {
                                if(devs[dKey].type === 'bulb') {
                                    if(transcript.includes('on')) toggleBulb(rKey, dKey, true);
                                    if(transcript.includes('off')) toggleBulb(rKey, dKey, false);
                                } else if(devs[dKey].type === 'fan') {
                                    if(transcript.includes('speed 1') || transcript.includes('one')) setFanSpeed(rKey, dKey, 1);
                                    else if(transcript.includes('speed 2') || transcript.includes('two')) setFanSpeed(rKey, dKey, 2);
                                    else if(transcript.includes('speed 3') || transcript.includes('three')) setFanSpeed(rKey, dKey, 3);
                                    else if(transcript.includes('speed 4') || transcript.includes('four')) setFanSpeed(rKey, dKey, 4);
                                    else if(transcript.includes('off') || transcript.includes('zero')) setFanSpeed(rKey, dKey, 0);
                                }
                            }
                        }
                    }
                }
            };
            recognition.onerror = () => resetMic();
            recognition.onend = () => resetMic();
        }

        function toggleSpeechRecognition() {
            if(!recognition) return alert('Voice recognition is not supported in this browser. Use Chrome.');
            try { recognition.start(); } catch(e) { recognition.stop(); }
        }

        function resetMic() {
            document.getElementById('micBtn').classList.remove('listening');
            document.getElementById('micText').innerText = "Voice";
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
